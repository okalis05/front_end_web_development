{% load static %}
<!doctype html>
<html lang="en" data-theme="bright">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>{{ page_title }} · powerbi_viz</title>

  <link rel="stylesheet" href="{% static 'dashboards/css/powerbi_viz.css' %}">
</head>

<body>
  <div class="bg">
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
    <div class="bg__glow bg__glow--c"></div>
    <div class="bg__grain" aria-hidden="true"></div>
  </div>

  {% include "powerbi_viz/partials/_topnav.html" %}

  <main class="shell">
    {% include "powerbi_viz/partials/_plates.html" %}
    <section class="content">
      {% block content %}{% endblock %}
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script defer src="{% static 'dashboards/js/powerbi_viz.js' %}"></script>

</body> 
</html>
