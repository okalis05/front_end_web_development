{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />

  <title>{% block title %}Francoise Elis — Software Engineer{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Minimal, cinematic portfolio — executive-grade systems, analytics, and full-stack engineering.{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'portfolio/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>

<body>
  <div class="bg">
    <div class="bg__horizon"></div>
    <div class="bg__grid"></div>
    <div class="bg__noise" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="{% url 'portfolio:home' %}" aria-label="Home">
      <span class="brand__dot"></span>
      <span class="brand__text">Francoise Elis</span>
    </a>

    <nav class="nav">
      <a href="#work">Work</a>
      <a href="#systems">Systems</a>
      <a href="#about">About</a>
      <a href="#contact" class="nav__cta">Contact</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'portfolio/script.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
