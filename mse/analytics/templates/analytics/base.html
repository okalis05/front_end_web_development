{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Francoise Elis — Software Engineer{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Minimal, cinematic portfolio — executive-grade systems, analytics, and full-stack engineering.{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'analytics/play.css' %}">
  <script src="{% static 'analytics/play.css' %}"></script>
  {% block extra_head %}{% endblock %}
</head>

<body>
    {% block body %}
    {% endblock %}
</body>
</html>
