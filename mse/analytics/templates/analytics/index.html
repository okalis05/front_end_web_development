<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Analysis with Tableau</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

  background:
    radial-gradient(circle at 50% 45%, rgba(255,190,90,0.18), rgba(0,0,0,0.96) 60%),
    linear-gradient(135deg, #020203 0%, #1a0006 40%, #2a1a08 100%);
}

canvas {
  position: fixed;
  inset: 0;
}

/* ===== PEN ===== */
#pen {
  position: fixed;
  top: 28px;
  right: 34px;
  width: 112px;
  height: 8px;
  border-radius: 10px;
  background: linear-gradient(90deg, #1f1f1f, #ffd98a, #c6922e);
  opacity: 0;
  transform: translateY(-18px);
  cursor: pointer;
  transition: opacity 1s ease, transform 1s ease;
}

#pen.show {
  opacity: 1;
  transform: translateY(0);
}

#pen.ignite {
  box-shadow:
    0 0 18px rgba(255,215,140,0.9),
    0 0 60px rgba(255,180,70,0.6);
}

/* ===== LINKS ===== */
#links {
  position: fixed;
  top: 82px;
  right: 34px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.link {
  position: relative;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .6px;
  text-decoration: none;

  background: linear-gradient(90deg, #fff3c4, #ffd98a, #c6922e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  opacity: 0;
  transform: translateX(22px);
  transition: opacity .7s ease, transform .7s ease;
}

.link::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0%;
  height: 1px;
  background: linear-gradient(90deg, #ffd98a, #ffb13c);
  transition: width .6s ease;
}

.link.show {
  opacity: 1;
  transform: translateX(0);
}
.link.show::after { width: 100%; }
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="pen"></div>

<div id="links">
  <a class="link" href="#">OVERVIEW</a>
  <a class="link" href="#">DASHBOARDS</a>
  <a class="link" href="#">ANALYTICS</a>
  <a class="link" href="#">INSIGHTS</a>
</div>

<script>
/* ================= CONFIG ================= */
const TITLE = "Data Analysis with Tableau";
const FONT_SIZE = 60;
const LETTER_DELAY = 110;
const GOLD = ["#fff6dc", "#ffd98a", "#e6b75a", "#c6922e"];

/* ================= CANVAS ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ctx.font = `700 ${FONT_SIZE}px system-ui`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
}
window.addEventListener("resize", resize);
resize();

/* ================= PARTICLES ================= */
const particles = [];
for (let i = 0; i < 1300; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: 0,
    vy: 0,
    r: Math.random() * 1.4 + 0.4,
    a: 1,
    c: GOLD[Math.floor(Math.random() * GOLD.length)]
  });
}

/* ================= FLAME + EMBERS ================= */
const embers = [];
let flameOn = false;

function spawnEmber(x, y) {
  embers.push({
    x, y,
    vx: Math.random() * 1.2,
    vy: -Math.random() * 1.5,
    a: 1,
    r: Math.random() * 1.5 + 0.5
  });
}

/* ================= STATE ================= */
let phase = "scatter";
let letterIndex = 0;
let titleAlpha = 0;
let tableauIgnite = 0;

const centerX = W / 2;
const centerY = H / 2;

/* ================= DRAW LOOP ================= */
function draw() {
  ctx.clearRect(0, 0, W, H);

  /* Background particles */
  particles.forEach(p => {
    if (phase === "scatter") {
      p.x += Math.sin(Date.now() * 0.0004 + p.y) * 0.18;
    }
    if (phase === "converge") {
      p.vx += (centerX - p.x) * 0.0007;
      p.vy += (centerY - p.y) * 0.0007;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= 0.004;
      if (p.a < 0) p.a = 0;
    }
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  /* ===== TITLE ===== */
  if (phase === "write") {
    titleAlpha = Math.min(titleAlpha + 0.03, 1);

    ctx.globalAlpha = titleAlpha;
    ctx.fillStyle = "#ffd98a";
    ctx.shadowColor = "#ffd98a";
    ctx.shadowBlur = 35;
    ctx.fillText("Data Analysis with", centerX - 140, centerY);
    
    ctx.shadowColor = "#ffdf9a";
    ctx.shadowBlur = 80 + tableauIgnite * 120;
    ctx.fillText("Tableau", centerX + 200, centerY);
    ctx.shadowBlur = 0;
  }

  /* ===== FLAME & EMBERS ===== */
  if (flameOn) {
    for (let i = 0; i < 2; i++) spawnEmber(penX + 112, penY + 4);
  }

  embers.forEach((e, i) => {
    e.x += e.vx;
    e.y += e.vy;
    e.vy += 0.02;
    e.a -= 0.02;
    ctx.globalAlpha = e.a;
    ctx.fillStyle = "#ffb13c";
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    if (e.a <= 0) embers.splice(i, 1);
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

/* ================= SEQUENCE ================= */
setTimeout(() => phase = "converge", 1200);

setTimeout(() => {
  phase = "write";
  const writer = setInterval(() => {
    letterIndex++;
    if (letterIndex > TITLE.length) {
      clearInterval(writer);
      tableauIgnite = 1;
      setTimeout(() => tableauIgnite = 0, 600);
      setTimeout(() => pen.classList.add("show"), 700);
    }
  }, LETTER_DELAY);
}, 2600);

/* ================= PEN FOLLOW ================= */
const pen = document.getElementById("pen");
let penX = window.innerWidth - 150;
let penY = 28;
let targetY = penY;

window.addEventListener("mousemove", e => {
  targetY = 20 + (e.clientY / window.innerHeight) * 40;
});

function movePen() {
  penY += (targetY - penY) * 0.08;
  pen.style.top = penY + "px";
  requestAnimationFrame(movePen);
}
movePen();

/* ================= SOUND ================= */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

function playIgnitionSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.value = 420;
  gain.gain.value = 0.02;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

/* ================= INTERACTION ================= */
const links = document.querySelectorAll(".link");
let linkIndex = 0;

pen.addEventListener("click", () => {
  if (linkIndex < links.length) {
    audioCtx.resume();
    playIgnitionSound();
    flameOn = true;
    pen.classList.add("ignite");

    links[linkIndex].classList.add("show");
    linkIndex++;

    if (linkIndex === links.length) {
      setTimeout(() => {
        flameOn = false;
        pen.classList.remove("ignite");
      }, 500);
    }
  }
});
</script>

</body>
</html>
